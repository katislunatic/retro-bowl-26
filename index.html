<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retro Bowl 26</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      border: none;
      /* Maintain aspect ratio 9:16 for mobile games */
      aspect-ratio: 9 / 16;
      object-fit: contain;
    }

    /* Optional: Message for users in landscape if you want a custom message */
    @media (orientation: landscape) {
      body {
        background: #111;
      }
    }
  </style>
</head>
<body>
  <iframe src="https://retrobowl26.com/retro-bowl-26.embed" allowfullscreen></iframe>
</body>
</html>
